name: Segment-Level Traffic Collector
on:
  schedule:
    - cron: '35 */2 * * *'
  workflow_dispatch:
defaults:
  run:
    working-directory: road-traffic-backend-main
jobs:
  collect-segments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: road-traffic-backend-main/package-lock.json
      - run: npm ci
      - run: node scripts/collectSegmentData.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
