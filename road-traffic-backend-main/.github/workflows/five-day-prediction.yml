name: 5-Day Traffic Prediction Generator

on:
  schedule:
    # Runs once daily at 01:00 UTC (06:30 IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  generate-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Might take longer than live analysis since it runs for 5 days * 12 slots * 27 routes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run 5-Day Prediction Generator
        run: node scripts/fiveDayPrediction.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          # Google API not strictly needed here as we skip Google for future predictions, but passing anyway
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
